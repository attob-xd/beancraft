<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>beancraft</title>
<link type="image/png" rel="shortcut icon" href="favicon.png" />
<style>
  :root { color-scheme: dark; }
  html, body { margin: 0; height: 100%; background: #101014; color: #e8e8ea; font-family: system-ui, sans-serif; }
  #choice { display: none; min-height: 100%; box-sizing: border-box; padding: 40px 16px;
    flex-direction: column; align-items: center; justify-content: center; gap: 28px; }
  .buttons { display: flex; flex-wrap: wrap; gap: 18px; justify-content: center; }
  a.ver { display: block; min-width: 180px; padding: 22px 28px; box-sizing: border-box; text-align: center;
    text-decoration: none; color: #fff; font-size: 30px; font-weight: 600; border-radius: 10px;
    background: #4a7dff; transition: transform .15s, filter .15s; }
  a.ver.hybrid { background: #2fa36b; }
  a.ver:hover, a.ver:focus { transform: translateY(-2px); filter: brightness(1.1); outline: none; }
</style>
</head>
<body>
<div id="choice">
  <div class="buttons">
    <a class="ver" id="classic" href="classic.html">1.12.2</a>
    <a class="ver hybrid" id="hybrid" href="hybrid/">1.18.2</a>
  </div>
</div>
<script>
"use strict";
(function () {
  // pass ?server=... and friends through to whichever client is picked
  var q = window.location.search || "";
  document.getElementById("classic").href = "classic.html" + q;
  document.getElementById("hybrid").href = "hybrid/" + q;
  function showChoice() {
    document.getElementById("choice").style.display = "flex";
  }
  // %%%%%%%%% access gate %%%%%%%%%%%%
  // Asks for a password once per browser, then remembers. This is a soft
  // gate for keeping casual visitors out, NOT security: it runs entirely
  // in the browser, so anyone who views source or edits localStorage can
  // walk straight past it.
  var ACCESS_PASSWORD = "AB12!";
  var ACCESS_KEY = "_client_access_ok";

  function alreadyUnlocked() {
  	try { return window.localStorage.getItem(ACCESS_KEY) === "1"; }
  	catch(e) { return false; }
  }

  function rememberUnlocked() {
  	try { window.localStorage.setItem(ACCESS_KEY, "1"); } catch(e) {}
  }

  function showGate(onPass) {
  	var wrap = document.createElement("div");
  	wrap.style.cssText = "position:fixed;inset:0;z-index:9999;background:#101014;"
  		+ "display:flex;align-items:center;justify-content:center;"
  		+ "font-family:system-ui,sans-serif;color:#e8e8ea;";
  	var box = document.createElement("div");
  	box.style.cssText = "text-align:center;max-width:320px;padding:28px;";
  	var title = document.createElement("div");
  	title.textContent = "Enter password";
  	title.style.cssText = "font-size:20px;margin-bottom:14px;";
  	var input = document.createElement("input");
  	input.type = "password";
  	input.autocomplete = "off";
  	input.style.cssText = "width:100%;padding:10px 12px;font-size:16px;border-radius:6px;"
  		+ "border:1px solid #3a3a42;background:#1b1b21;color:#fff;box-sizing:border-box;";
  	var err = document.createElement("div");
  	err.style.cssText = "color:#ff6b6b;font-size:13px;height:18px;margin-top:8px;";
  	var btn = document.createElement("button");
  	btn.textContent = "Enter";
  	btn.style.cssText = "margin-top:10px;width:100%;padding:10px;font-size:16px;"
  		+ "border:0;border-radius:6px;background:#4a7dff;color:#fff;cursor:pointer;";
  	function submit() {
  		if(input.value === ACCESS_PASSWORD) {
  			rememberUnlocked();
  			wrap.parentNode.removeChild(wrap);
  			onPass();
  		}else {
  			err.textContent = "Wrong password";
  			input.value = "";
  			input.focus();
  		}
  	}
  	btn.addEventListener("click", submit);
  	input.addEventListener("keydown", function(e) {
  		if(e.key === "Enter") submit();
  	});
  	box.appendChild(title); box.appendChild(input);
  	box.appendChild(err); box.appendChild(btn);
  	wrap.appendChild(box);
  	document.body.appendChild(wrap);
  	input.focus();
  }

  if(alreadyUnlocked()) {
  	showChoice();
  }else {
  	showGate(showChoice);
  }
})();
</script>
</body>
</html>
