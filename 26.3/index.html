  <script>
    // Rinth's mark is the game's own carrot: the client gives it to the page once the game has
    // loaded (Logo, PlatformShell.setPageIcon), and the page keeps it for its next start. No game
    // texture is copied into the page; before the first start there's no mark.
    try {
      var mark = localStorage.getItem("rinth.mark");
      if (mark && mark.indexOf("data:image/png;base64,") === 0) {
        document.querySelector('link[rel="icon"]').href = mark;
        document.documentElement.style.setProperty("--incari-mark", 'url("' + mark + '")');
        document.documentElement.classList.add("has-mark");
      }
    } catch (e) {}
  </script>

    html, body { margin: 0; height: 100%; background: #1d140d; color: #fff; font: 14px system-ui, sans-serif; }
    #incari-canvas { display: block; width: 100vw; height: 100vh; outline: none; }
    /* Minecraft's classic menus (Rinth Client): a dark floor of dirt-coloured blocks, white text with
       a hard grey shadow, grey bevelled buttons and the game's white outlined loading bar. Drawn
       with gradients: no game texture is copied. */
    #incari-loader { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center;
      justify-content: center; gap: 14px; background-color: #2b1e14;
      background-image: linear-gradient(rgba(0, 0, 0, 0.62), rgba(0, 0, 0, 0.62)),
        repeating-conic-gradient(#5e4331 0 25%, #4d3626 0 50%),
        repeating-conic-gradient(rgba(122, 90, 64, 0.5) 0 25%, transparent 0 50%);
      background-size: auto, 16px 16px, 28px 28px; background-position: 0 0, 0 0, 6px 10px; }
    #incari-loader::before { content: ""; width: 96px; height: 96px; background: var(--incari-mark) center / contain no-repeat;
      image-rendering: pixelated; filter: drop-shadow(4px 4px 0 rgba(0, 0, 0, 0.5)); }
    #incari-loader[hidden] { display: none; }
    /* No room kept for a mark the page doesn't have yet. */
    :root:not(.has-mark) #incari-loader::before { display: none; }
    #incari-loader h1 { margin: 0 0 8px; font-size: 34px; font-weight: 800; letter-spacing: 0.14em; padding-left: 0.14em;
      text-transform: uppercase; color: #fff; text-shadow: 3px 3px 0 #3f3f3f; }
    /* The bar as the game's own loading screen draws it: a white outline, filled white from the left. */
    #incari-track { box-sizing: border-box; width: min(400px, 80vw); height: 14px; padding: 2px; border: 2px solid #fff; }
    #incari-bar { width: 0; min-width: 2px; height: 100%; background: #fff; transition: width 120ms linear; }
    #incari-bar.indeterminate { animation: incari-pulse 1.2s steps(4) infinite; }
    #incari-loader.failed #incari-bar { background: #ff5555; animation: none; }
    #incari-status { font-size: 16px; color: #fff; text-shadow: 2px 2px 0 #3f3f3f; }
    #incari-detail { min-height: 1.4em; max-width: min(560px, 90vw); text-align: center; color: #c6c6c6;
      text-shadow: 2px 2px 0 #3f3f3f; }
    #incari-track[hidden], #incari-choose[hidden] { display: none; }
    #incari-choose { display: flex; flex-direction: column; gap: 8px; width: min(480px, calc(100vw - 32px)); }
    /* A Minecraft button: grey, lit on its top and left edges, shaded on the others, black-edged. */
    .incari-pick { display: flex; flex-direction: column; gap: 4px; padding: 12px 16px; text-align: left;
      font: inherit; color: #fff; text-shadow: 2px 2px 0 #3f3f3f; background: #6f6f6f; border: 2px solid #000;
      border-radius: 0; box-shadow: inset 2px 2px 0 #a8a8a8, inset -2px -2px 0 #505050; cursor: pointer; }
    .incari-pick:hover:not(:disabled), .incari-pick:focus-visible { border-color: #fff; outline: none; background: #7b7b9e;
      box-shadow: inset 2px 2px 0 #bcbce0, inset -2px -2px 0 #565678; }
    .incari-pick:disabled { cursor: not-allowed; color: #a0a0a0; background: #2c2c2c; box-shadow: none; }
    .incari-pick-title { display: flex; align-items: center; gap: 8px; font-size: 16px; font-weight: 700; }
    .incari-badge { padding: 1px 6px; font-size: 12px; font-weight: 700; color: #ffff55; background: rgba(0, 0, 0, 0.45); }
    .incari-badge.quiet { color: #c6c6c6; }
    .incari-pick-text { font-size: 13px; color: #e0e0e0; }
    .incari-pick-why { font-size: 13px; color: #ffaa00; }
    .incari-pick-why:empty { display: none; }
    .incari-pick-hint { margin: 2px 0 0; font-size: 13px; color: #c6c6c6; text-align: center; text-shadow: 2px 2px 0 #3f3f3f; }
    @keyframes incari-pulse { 0%, 100% { opacity: 0.35; } 50% { opacity: 1; } }
  </style>
</head>
<body>
  <canvas id="incari-canvas"></canvas>
  <div id="incari-loader" role="status" aria-live="polite">
    <h1>Rinth</h1>
    <div id="incari-track"><div id="incari-bar"></div></div>
    <div id="incari-status">Loading</div>
    <div id="incari-detail"></div>
    <!-- Where both builds can run, the player picks one (boot.ts, ADR 0036); `?build=fast|compatible`
         skips this. Fast is the JSPI build, Compatible the coroutine build. -->
    <div id="incari-choose" role="group" aria-labelledby="incari-status" hidden>
      <button id="incari-pick-fast" class="incari-pick" type="button" aria-describedby="incari-why-fast">
        <span class="incari-pick-title">Fast <span class="incari-badge">Recommended</span></span>
        <span class="incari-pick-text">Higher frame rates, a smaller download and faster loading. Needs a recent
          browser.</span>
        <span class="incari-pick-why" id="incari-why-fast"></span>
      </button>
      <button id="incari-pick-compatible" class="incari-pick" type="button" aria-describedby="incari-why-compatible">
        <span class="incari-pick-title">Compatible <span class="incari-badge quiet">For older browsers</span></span>
        <span class="incari-pick-text">Works in Safari and older versions of Chrome and Firefox, but runs slower.</span>
        <span class="incari-pick-why" id="incari-why-compatible"></span>
      </button>
      <p class="incari-pick-hint">Choose Compatible only if Fast won't start in your browser.</p>
    </div>
  </div>
  <noscript>The game needs JavaScript.</noscript>
  <!-- The loader (src/main/ts/boot.ts, types stripped by :app-web:pageScripts). Builds contain
       Mojang code: this page is for your own machine or your own server, never published. -->
  <script type="module" src="boot.js"></script>
</body>
</html>
